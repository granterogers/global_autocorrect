# D179: the relay for shared learning, a Cloudflare Worker (free plan). Set up and deployed by relay/deploy.ps1, which
# adds its storage (the [[kv_namespaces]] entry, LEARNING) the first time.
name = "ga-learning"
main = "worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = true

[[kv_namespaces]]
binding = "LEARNING"
id = "f5914895cd714ff1a3d43d8cfbce3492"
