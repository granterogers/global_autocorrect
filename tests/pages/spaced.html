<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><title>GA test: spaced</title><style>body{font:16px "Segoe UI",sans-serif;margin:24px} #ed{display:block;width:720px;min-height:160px;padding:8px;border:1px solid #888;outline:none;white-space:pre-wrap;font:15px Arial,sans-serif;line-height:1.6}</style></head>
<!-- D79: lines spaced out as in Intercom's reply box, so Chromium's caret is taller than the text. -->
<body><div id="ed" contenteditable="true" spellcheck="false"></div><script>window.getText=()=>document.getElementById('ed').innerText;document.getElementById('ed').focus();</script></body></html>
