# D138 (after D137: one placed failure on one PC switched placed fixes off in Edge, Teams and WhatsApp, and the brain
# shipped that to every PC within 15 minutes). What a PC learns no longer goes straight to every PC:
# scripts/publish-learning.ps1 sends it to the brain-candidate branch, built on main. This runs the stress suite
# (chaos typing, varied messages, the right and the misbehaving model) and the real-model test with that brain built
# into the app, and only if both pass merges it into main, from where every running copy downloads it. If not, the
# lesson is held back and an issue labelled "brain" says why.
# D179: lessons shared by other people's installs come on community-candidate (community-learning.yml starts this run
# there). After the same tests they also wait for the owner's approval: the "community-approval" environment, whose
# required reviewer GitHub notifies. The run's summary says what the lesson would change.
name: Brain gate

on:
  push:
    branches: [brain-candidate]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: brain-gate-${{ github.ref_name }}   # D179: per branch, so a shared lesson waiting for approval isn't cancelled by this PC's next one
  cancel-in-progress: true

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        adversary: [false, true]
    uses: ./.github/workflows/e2e.yml
    with:
      slot: ${{ format('9{0}{1}', github.run_number, matrix.adversary && '1' || '0') }}
      chaos: true
      varied: true
      adversary: ${{ matrix.adversary }}
      repeat: '1'
      editors: 'notepad,wpf,textarea,contenteditable,prosemirror,lexical,ckeditor,quill,tinymce,slate,intercom,email,chat,teams'

  real-use:
    uses: ./.github/workflows/real-use.yml

  # D179: what a shared lesson would change, on the run's page, for whoever approves it.
  describe:
    if: github.ref_name == 'community-candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: community-candidate
      - name: What this lesson changes
        run: git log -1 --format=%B >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: [stress, real-use]
    if: github.ref_name != 'community-candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Merge the lesson into main
        run: bash .github/scripts/promote-brain.sh

  # D179: the same, once the owner approves (GitHub waits here and notifies them).
  promote-approved:
    needs: [stress, real-use, describe]
    if: github.ref_name == 'community-candidate'
    environment: community-approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: community-candidate
          fetch-depth: 0
      - name: Merge the approved lesson into main
        run: bash .github/scripts/promote-brain.sh

  held:
    needs: [stress, real-use]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Say why the lesson was held back
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="A brain lesson was held back: with it built in, the stress runs or the real-model test failed. Every PC keeps the brain on main. Run: $URL"
          gh label create brain --repo "$REPO" --color 5319E7 --description "A learned brain change held back by the Brain gate (D138)" 2>/dev/null || true
          open=$(gh issue list --repo "$REPO" --label brain --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --repo "$REPO" --body "$body"
          else gh issue create --repo "$REPO" --label brain --title "A brain lesson was held back" --body "$body"; fi
