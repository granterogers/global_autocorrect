# D179: what installs share from the app ("Share what it learns" on the About page) reaches every PC only by this road:
#   relay (relay/, keeps one checked entry per install) -> this job, weekly: folds them into the brain on a branch of its
#   own (community-candidate) with a plain-words summary -> the Brain gate: the stress runs and the real-model test with
#   that brain built in -> the owner's approval (the "community-approval" environment) -> main -> every PC within 15 min.
# The relay can't write to GitHub; this job reads from it with COMMUNITY_READ_TOKEN (set by relay/deploy.ps1).
name: Community learning

on:
  schedule:
    - cron: '15 4 * * 1'   # Mondays: one approval a week at most, after the nightly runs
  workflow_dispatch:

permissions:
  contents: write
  actions: write          # starts the Brain gate (a push made with the job's token wouldn't)

concurrency:
  group: community-learning
  cancel-in-progress: false

jobs:
  collect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.403' # PLAN.md "Pinned versions" (2.4.c)
      - name: Collect, fold into the brain and send to the Brain gate
        shell: pwsh
        env:
          TOKEN: ${{ secrets.COMMUNITY_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:TOKEN) { "No relay yet (COMMUNITY_READ_TOKEN isn't set: run relay/deploy.ps1). Nothing to collect." >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          $url = (Get-Content brain/brain.json -Raw | ConvertFrom-Json).share.url
          if (-not $url) { "The brain names no relay. Nothing to collect." >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          $shared = Join-Path $env:RUNNER_TEMP 'shared.json'
          $summary = Join-Path $env:RUNNER_TEMP 'summary.md'
          Invoke-WebRequest $url -Headers @{ Authorization = "Bearer $env:TOKEN" } -OutFile $shared
          dotnet run --project tools/GlobalAutocorrect.DataGen -c Release -- community --in $shared --dir data/learning --out brain/brain.json --summary $summary
          if ($LASTEXITCODE -ne 0) { throw 'folding the shared learning in failed' }
          Get-Content $summary >> $env:GITHUB_STEP_SUMMARY
          if (-not (git status --porcelain -- brain data/learning)) { "`nNothing new since the brain on main." >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- brain data/learning
          $msg = Join-Path $env:RUNNER_TEMP 'msg.txt'
          @("Brain: shared learning from installs (D179, counts only)", "", (Get-Content $summary -Raw)) | Set-Content $msg
          git commit -q -F $msg
          git push --force origin HEAD:refs/heads/community-candidate
          gh workflow run brain-gate.yml --ref community-candidate
          "`nSent to the Brain gate; it waits for your approval once its tests pass." >> $env:GITHUB_STEP_SUMMARY
